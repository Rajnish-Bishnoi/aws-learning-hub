<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Learning Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>☁ AWS Learning Hub</h1>
  <p>My AWS Practical Notes • Commands • Concepts • Interview Preparation</p>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3>📚 AWS Topics</h3>
    <input id="search" class="search" placeholder="Search topic..." oninput="filterTopics()">
    <div id="topicList"></div>
  </aside>

  <main id="content" class="content"></main>
</div>

<script src="topics.js"></script>
<script>
let currentTopic = "home";

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function renderList(items) {
  if (!items || !items.length) return "<p class='muted'>Not added yet.</p>";
  return "<ul>" + items.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>";
}

function renderCommands(commands) {
  if (!commands || !commands.length) return "<p class='muted'>Commands not added yet.</p>";
  return commands.map(c => `<pre><code>${esc(c)}</code></pre>`).join("");
}

function renderTopic(topic) {
  return `
    <a class="back" onclick="showTopic('home')">← Back to Home</a>
    <h2>${esc(topic.number)}. ${esc(topic.title)}</h2>

    <section class="card">
      <h3>📌 Concept</h3>
      <p>${esc(topic.concept)}</p>
    </section>

    <section class="card">
      <h3>🧠 Simple Explanation</h3>
      <p>${esc(topic.simple)}</p>
    </section>

    <section class="card">
      <h3>🏢 Real Company Example</h3>
      <p>${esc(topic.company)}</p>
    </section>

    <section class="card">
      <h3>🛠️ Practical</h3>
      ${topic.practical.map(p => `<p>${esc(p)}</p>`).join("")}
    </section>

    <section class="card">
      <h3>💻 Commands</h3>
      ${renderCommands(topic.commands)}
    </section>

    <section class="card">
      <h3>📋 Steps</h3>
      ${renderList(topic.steps)}
    </section>

    <section class="card warning">
      <h3>⚠️ Common Mistakes</h3>
      ${renderList(topic.mistakes)}
    </section>

    <section class="card">
      <h3>🎯 Interview Questions</h3>
      ${renderList(topic.interview)}
    </section>

    <section class="card notes">
      <h3>📝 My Notes</h3>
      ${topic.notes.map(n => `<p>${esc(n)}</p>`).join("")}
    </section>
  `;
}

function showTopic(id, button) {
  currentTopic = id;
  document.querySelectorAll(".topic-btn").forEach(b => b.classList.remove("active"));
  if (button) button.classList.add("active");

  if (id === "home") {
    document.getElementById("content").innerHTML = `
      <h2>🚀 Welcome to AWS Learning Hub</h2>
      <section class="card">
        <h3>How to use this website</h3>
        <p>Every AWS topic follows the same learning format: Concept → Simple Explanation → Company Example → Practical → Commands → Steps → Common Mistakes → Interview Questions → My Notes.</p>
      </section>
      <section class="card">
        <h3>✏️ Easy Editing</h3>
        <p>All topic content is stored in <b>topics.js</b>. To add or edit a topic, you normally only edit that one file. You do not need to change the website design.</p>
      </section>
    `;
  } else {
    const topic = topics.find(t => t.id === id);
    document.getElementById("content").innerHTML = renderTopic(topic);
  }
  window.scrollTo(0, 0);
}

function buildMenu() {
  const list = document.getElementById("topicList");
  list.innerHTML = `
    <button class="topic-btn active" onclick="showTopic('home',this)">🏠 Home</button>
    ${topics.map(t => `<button class="topic-btn" data-title="${esc(t.number + ' ' + t.title)}" onclick="showTopic('${t.id}',this)">${esc(t.number)}. ${esc(t.title)}</button>`).join("")}
  `;
}

function filterTopics() {
  const q = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".topic-btn").forEach(btn => {
    btn.style.display = btn.innerText.toLowerCase().includes(q) ? "block" : "none";
  });
}

buildMenu();
showTopic("home");
</script>
</body>
</html>
